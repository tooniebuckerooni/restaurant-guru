<script>
"use strict";
/* ================= Engine (port of web/src/lib/engine/generate.ts) ================= */
const MIN_H = 60, DAY_MIN = 1440;
const weekdayOf = iso => (new Date(iso + "T00:00:00Z").getUTCDay() + 6) % 7;
const overlaps = (a, b) => a.start < b.end && b.start < a.end;
const rangeHours = r => (r.end - r.start) / MIN_H;
const coveredBy = (shift, ws) => ws.some(w => w.start <= shift.start && shift.end <= w.end);
const isWeekend = date => { const wd = weekdayOf(date); return wd === 4 || wd === 5 || wd === 6; };

function availabilityCovers(staff, date, shift) {
  const ws = staff.availability[weekdayOf(date)];
  if (!ws) return false;
  if (coveredBy(shift, ws)) return true;
  if (shift.end <= DAY_MIN) return false;
  if (!coveredBy({ start: shift.start, end: DAY_MIN }, ws)) return false;
  const nws = staff.availability[(weekdayOf(date) + 1) % 7];
  return !!nws && coveredBy({ start: 0, end: shift.end - DAY_MIN }, nws);
}
function absRange(dates, slot) {
  const base = dates.indexOf(slot.date) * DAY_MIN;
  return { start: base + slot.range.start, end: base + slot.range.end };
}
function newCtx() { return { hours: new Map(), slots: new Map(), weekend: new Map() }; }
function assignSlot(ctx, slot, staff) {
  slot.staffId = staff.id;
  ctx.hours.set(staff.id, (ctx.hours.get(staff.id) || 0) + rangeHours(slot.range));
  if (!ctx.slots.has(staff.id)) ctx.slots.set(staff.id, []);
  ctx.slots.get(staff.id).push(slot);
  if (isWeekend(slot.date)) ctx.weekend.set(staff.id, (ctx.weekend.get(staff.id) || 0) + 1);
}
function unassignSlot(ctx, slot, staff) {
  slot.staffId = null;
  ctx.hours.set(staff.id, (ctx.hours.get(staff.id) || 0) - rangeHours(slot.range));
  ctx.slots.set(staff.id, (ctx.slots.get(staff.id) || []).filter(s => s.id !== slot.id));
  if (isWeekend(slot.date)) ctx.weekend.set(staff.id, (ctx.weekend.get(staff.id) || 0) - 1);
}
function hardRuleViolation(input, ctx, staff, slot) {
  if (!staff.roleIds.includes(slot.roleId)) return "not qualified for this role";
  if (staff.timeOff.includes(slot.date)) return "approved time off";
  if (!availabilityCovers(staff, slot.date, slot.range)) return "outside availability";
  const cap = staff.maxHoursPerWeek * input.dates.length / 7;
  if ((ctx.hours.get(staff.id) || 0) + rangeHours(slot.range) > cap + 1e-9)
    return "over max hours (" + staff.maxHoursPerWeek + "h/wk)";
  const mine = ctx.slots.get(staff.id) || [];
  if (input.rules.maxHoursPerDay) {
    const dayHours = mine.filter(s => s.date === slot.date).reduce((a, s) => a + rangeHours(s.range), 0);
    if (dayHours + rangeHours(slot.range) > input.rules.maxHoursPerDay + 1e-9)
      return "over daily max (" + input.rules.maxHoursPerDay + "h/day)";
  }
  if (input.rules.maxConsecutiveDays) {
    const worked = new Set(mine.map(s => input.dates.indexOf(s.date)));

  </div>`;
  if (!state.hintDismissed) out += `
  <div class="hint no-print">
    <div><b>Try it:</b> <b>Set up</b> holds your staff and shift parameters. Generate, then click any shift to reassign — the picker explains who can't take it and why. Publish, then view as staff below.</div>
    <button data-action="dismiss-hint" aria-label="Dismiss">×</button>
  </div>`;
  out += staleBanner();
  if (s) {
    out += `<div class="stats">
      <div class="tile"><div class="label">Total hours</div><div class="value tabular">${s.totalHours} hrs</div></div>
      <div class="tile"><div class="label">Labor cost</div><div class="value tabular">${dollars(s.totalCost)}</div>
        ${state.rules.budgetCents ? `<div class="sub">budget ${dollars(state.rules.budgetCents * state.dates.length / 7)}</div>` : ""}</div>
      <div class="tile"><div class="label">Open shifts</div><div class="value tabular">${s.openCount}</div></div>
      <div class="tile"><div class="label">Warnings</div><div class="value tabular">${s.warnings.length}</div></div>
    </div>`;
    if (s.warnings.length) out += `<div class="warnings no-print">
      ${s.warnings.slice(0, 4).map(esc).map(w => `<div>${w}</div>`).join("")}
      ${s.warnings.length > 4 ? `<div>…and ${s.warnings.length - 4} more</div>` : ""}
    </div>`;
  }
  if (state.slots) {
    out += `<div class="gridwrap"><div class="grid" style="grid-template-columns:repeat(${state.dates.length},minmax(${state.dates.length > 7 ? "110px" : "0"},1fr))">`;
    for (const d of state.dates) {
      const f = fmtDay(d);
      out += `<div class="dayhead"><div class="dow">${f.dow}</div><div class="date">${f.date}</div></div>`;
    }
    for (const d of state.dates) {
      out += `<div class="daycol">`;
      const day = state.slots.filter(x => x.date === d).sort((a, b) => a.range.start - b.range.start || a.roleId.localeCompare(b.roleId));
      for (const sl of day) {
        const open = sl.staffId === null;
        const who = open ? "Open shift" : esc((state.staff.find(x => x.id === sl.staffId) || { name: "?" }).name);
        const ck = roleColorKey(sl.roleId);
        const style = open ? "" : ck ? `style="background:var(--role-${ck}-tint);border-left-color:var(--role-${ck})"` : `style="background:var(--surface-sunken);border-left-color:var(--border-strong)"`;
        out += `<button class="shift${open ? " open" : ""}" ${style} data-action="pick" data-slot="${sl.id}" title="Click to reassign">
          <span class="who">${who}</span><br><span class="what tabular">${roleName(sl.roleId)} · ${fmtTime(sl.range.start)}–${fmtTime(sl.range.end)}</span>
        </button>`;
      }
      out += `</div>`;
    }
    out += `</div></div>`;
  } else {
    out += `<div class="empty"><div class="big">Next week is ready to build</div>
      <div>${state.staff.length} staff · ${state.template.length} shift requirements · one click</div></div>`;
  }
  if (s) {
    out += `<section class="meters"><h2>Hours this week</h2>`;
    for (const t of s.totals.filter(t => t.shiftCount).sort((a, b) => b.hours - a.hours)) {
      const st = state.staff.find(x => x.id === t.staffId);
      const pct = Math.min(100, t.hours / st.targetHoursPerWeek * 100);
      out += `<div class="meterrow"><div class="name">${esc(st.name)}</div>
        <div class="bar"><div class="fill${t.hours > st.targetHoursPerWeek ? " over" : ""}" style="width:${pct}%"></div></div>
        <div class="nums tabular">${t.hours}h / ${st.targetHoursPerWeek}h</div></div>`;
    }
    out += `</section>`;
  }
  out += `<section class="board86">
    <h2>86 board</h2>
    <div class="desc">Out for service tonight. Staff see this on their phones the moment it changes.</div>
    <div class="chips86">${state.eightySix.length
      ? state.eightySix.map((n, i) => `<span class="chip86">86 ${esc(n)}<button data-action="remove-86" data-idx="${i}" aria-label="Restore ${esc(n)}">✕</button></span>`).join("")
      : `<span style="color:var(--text-tertiary);font-size:13px">Nothing 86'd — good night so far.</span>`}</div>
    <div class="add86 no-print"><input type="text" id="i-86" placeholder="86 something… (e.g. Burrata)" maxlength="60">
      <button class="btn btn-secondary btn-sm" data-action="add-86">86 it</button></div>
  </section>`;
  out += renderChat("Manager");
  out += `<footer class="no-print">Demo: view as staff —
    ${state.staff.slice(0, 4).map(st => `<a href="#" data-action="view-staff" data-staff="${st.id}">${esc(st.name)}</a>`).join(" · ")}
    &nbsp;·&nbsp; <a href="#" data-action="reset">Reset demo</a></footer>`;
  if (picker) out += renderPicker();
  if (toastMsg) out += `<div class="toast no-print">${esc(toastMsg)}</div>`;
  return out;
}

function renderPicker() {
  const slot = state.slots.find(s => s.id === picker.slotId);
  return `<div class="overlay no-print" data-action="close-overlay">
    <div class="scrim"></div>
    <div class="modal" role="dialog" aria-label="Assign shift">
      <h3>Assign shift</h3>
      <div class="shiftinfo tabular">${roleName(slot.roleId)} · ${fmtDayLong(slot.date)} · ${fmtTime(slot.range.start)}–${fmtTime(slot.range.end)}</div>
      <div class="list">
        ${picker.options.map(o => {
          const blocked = o.blockedReason !== null, cur = o.staffId === slot.staffId;
          return `<button class="cand${cur ? " current" : ""}" ${blocked || cur ? "disabled" : ""} data-action="assign" data-staff="${o.staffId}">
            <b>${esc(o.name)}</b> <span class="hrs tabular">· ${o.currentHours}h</span>${cur ? ` <span class="hrs">· current</span>` : ""}
            ${blocked ? `<div class="why">${esc(o.blockedReason)}</div>` : ""}
          </button>`;
        }).join("")}
      </div>
      ${slot.staffId !== null ? `<button class="unassign" data-action="assign" data-staff="">Unassign — leave shift open</button>` : ""}
    </div>
  </div>`;
}

function renderSetup() {
  let out = `
  <div class="topbar">
    <div>
      <div class="wordmark">Set up</div>
      <div class="subtitle">${esc(state.venue)} — venue, roles, staff, weekly shifts, and rules. Done once; tweaked rarely.</div>
    </div>
    <div style="display:flex;gap:8px" class="no-print">
      <button class="btn btn-primary" data-action="view-manager">← Back to schedule</button>
    </div>
  </div>`;
  out += staleBanner();

  /* Venue */
  out += `<section class="section"><h2>Venue</h2>
  <div class="desc">The basics: what this place is called and how often you schedule.</div>
  <div class="formgrid">
    <label for="v-name">Business name</label>
    <input type="text" id="v-name" value="${esc(state.venue)}" maxlength="60" data-venue="name">
    <label for="v-cadence">Schedule cadence</label>
    <select id="v-cadence" data-venue="cadence">
      <option value="7" ${state.cadenceDays === 7 ? "selected" : ""}>Weekly (7 days)</option>
      <option value="14" ${state.cadenceDays === 14 ? "selected" : ""}>Biweekly (14 days)</option>
    </select>
  </div></section>`;

  /* Roles */
  out += `<section class="section"><h2>Roles</h2>
  <div class="desc">The jobs people work. Each gets its own color on the grid. Rename inline; removing a role removes its shifts.</div>`;
  for (const r of state.roles) {
    out += `<div class="rolerow">
      <span class="roledot" style="background:var(--role-${r.colorKey})"></span>
      <input type="text" value="${esc(r.name)}" maxlength="30" data-role-rename="${r.id}">
      <span class="meta">${state.staff.filter(s => s.roleIds.includes(r.id)).length} staff · ${state.template.filter(t => t.roleId === r.id).length} weekly shifts</span>
      <button class="iconbtn" data-action="remove-role" data-role="${r.id}" title="Remove ${esc(r.name)}">✕</button>
    </div>`;
  }
  out += `<div style="margin-top:8px"><button class="btn btn-secondary btn-sm" data-action="add-role">+ Add role</button></div></section>`;

  /* Staff */
  out += `<section class="section"><h2>Staff</h2>
  <div class="desc">Who works here, what they can do, and when they're available. The generator never schedules against these.</div>`;
  for (const s of state.staff) {
    const chips = Array.from({ length: 7 }, (_, d) =>
      `<span class="daychip${s.availability[d] ? " on" : ""}" title="${WD[d]}: ${PRESET_LABELS[presetOf(s.availability[d])]}">${WD[d][0]}</span>`).join("");
    out += `<div class="staffrow">
      <div><b>${esc(s.name)}</b><span class="dayschips">${chips}</span><br>
        <span class="meta tabular">${s.roleIds.map(roleName).join(", ")} · $${(s.wageCents / 100).toFixed(2)}/hr · target ${s.targetHoursPerWeek}h · max ${s.maxHoursPerWeek}h</span></div>
      <div style="display:flex;gap:6px">
        <button class="btn btn-secondary btn-sm" data-action="edit-staff" data-staff="${s.id}">Edit</button>
        <button class="iconbtn" data-action="remove-staff" data-staff="${s.id}" title="Remove ${esc(s.name)}">✕</button>
      </div>
    </div>`;
  }
  out += `<div style="margin-top:12px"><button class="btn btn-primary btn-sm" data-action="add-staff">+ Add staff member</button></div></section>`;

  /* Weekly shifts */
  out += `<section class="section"><h2>Weekly shifts</h2>
  <div class="desc">What a standard week needs, day by day. Every row becomes that many seats to fill when you generate.</div>`;
  for (let wd = 0; wd < 7; wd++) {
    out += `<div class="tmplday"><h4>${WD[wd]}</h4>`;
    state.template.forEach((t, idx) => {
      if (t.weekday !== wd) return;
      out += `<div class="tmplrow">
        <select data-tmpl="${idx}" data-field="roleId">${state.roles.map(r => `<option value="${r.id}" ${r.id === t.roleId ? "selected" : ""}>${esc(r.name)}</option>`).join("")}</select>
        ${timeSelect(`data-tmpl="${idx}" data-field="start"`, t.start)}
        <span style="color:var(--text-tertiary)">to</span>
        ${timeSelect(`data-tmpl="${idx}" data-field="end"`, t.end)}
        <span style="color:var(--text-tertiary)">×</span>
        <input type="number" min="1" max="20" value="${t.count}" data-tmpl="${idx}" data-field="count" aria-label="people needed">
        <button class="iconbtn" data-action="remove-tmpl" data-idx="${idx}" title="Remove shift">✕</button>
      </div>`;
    });
    out += `<button class="btn btn-secondary btn-sm" data-action="add-tmpl" data-weekday="${wd}">+ Add shift</button></div>`;
  }
  out += `</section>`;

  /* Rules */
  out += `<section class="section"><h2>Rules</h2>
  <div class="desc">Hard limits the generator will never break, soft preferences it optimizes for, and your labor budget.</div>
  <div class="formgrid">
    <label for="r-rest">Minimum rest between shifts</label>
    <div><input type="number" id="r-rest" min="0" max="24" value="${state.rules.minRestHours}" data-rule="minRestHours"> hours</div>
    <label for="r-clopen">Allow clopens (close then open)</label>
    <div><input type="checkbox" id="r-clopen" ${state.rules.allowClopens ? "checked" : ""} data-rule="allowClopens"></div>
    <label for="r-maxday">Max hours per day</label>
    <div><input type="number" id="r-maxday" min="1" max="24" value="${state.rules.maxHoursPerDay}" data-rule="maxHoursPerDay"> hours</div>
    <label for="r-consec">Max consecutive days</label>
    <div><input type="number" id="r-consec" min="1" max="14" value="${state.rules.maxConsecutiveDays}" data-rule="maxConsecutiveDays"> days</div>
    <label for="r-ot">Warn about overtime past</label>
    <div><input type="number" id="r-ot" min="1" max="80" value="${state.rules.overtimeWarnHours}" data-rule="overtimeWarnHours"> hours/week</div>
    <label for="r-fair">Spread weekend shifts fairly</label>
    <div><input type="checkbox" id="r-fair" ${state.rules.fairWeekends ? "checked" : ""} data-rule="fairWeekends"></div>
    <label for="r-cost">Prefer lower-cost staff when tied</label>
    <div><input type="checkbox" id="r-cost" ${state.rules.preferLowerCost ? "checked" : ""} data-rule="preferLowerCost"></div>
    <label for="r-budget">Weekly labor budget</label>
    <div>$ <input type="number" id="r-budget" min="0" step="100" value="${Math.round((state.rules.budgetCents || 0) / 100)}" data-rule="budgetCents"></div>
  </div></section>`;

  out += `<footer class="no-print"><a href="#" data-action="reset">Reset demo to defaults</a></footer>`;
  if (staffModal) out += renderStaffModal();
  if (toastMsg) out += `<div class="toast no-print">${esc(toastMsg)}</div>`;
  return out;
}

function renderStaffModal() {
  const m = staffModal;
  return `<div class="overlay" data-action="close-staff-modal">
    <div class="scrim"></div>
    <div class="modal" role="dialog" aria-label="${m.id ? "Edit" : "Add"} staff member">
      <h3>${m.id ? "Edit" : "Add"} staff member</h3>
      <div class="formgrid">
        <label for="f-name">Name</label><input type="text" id="f-name" value="${esc(m.name)}" placeholder="e.g. Riley M.">
        <label for="f-wage">Wage $/hr</label><input type="number" id="f-wage" min="0" step="0.25" value="${m.wage}">
        <label for="f-target">Target hrs/wk</label><input type="number" id="f-target" min="0" max="80" value="${m.targetH}">
        <label for="f-max">Max hrs/wk</label><input type="number" id="f-max" min="0" max="80" value="${m.maxH}">
      </div>
      <div style="font-size:13px;font-weight:600;margin-bottom:4px">Roles they can work</div>
      <div class="rolechecks" style="margin-bottom:12px">
        ${state.roles.map(r => `<label><input type="checkbox" id="f-role-${r.id}" ${m.roleIds.includes(r.id) ? "checked" : ""}>${esc(r.name)}</label>`).join("")}
      </div>
      <div style="font-size:13px;font-weight:600;margin-bottom:4px">Availability</div>
      <div class="availgrid">
        ${WD.map((d, i) => `<label for="f-day-${i}">${d}</label>
          <select id="f-day-${i}">${Object.keys(PRESETS).map(p => `<option value="${p}" ${m.days[i] === p ? "selected" : ""}>${PRESET_LABELS[p]}</option>`).join("")}</select>`).join("")}
      </div>
      <div class="modalbtns">
        <button class="btn btn-secondary" data-action="close-staff-modal-btn">Cancel</button>
        <button class="btn btn-primary" data-action="save-staff">Save</button>
      </div>
    </div>
  </div>`;
}

function renderStaffView() {
  const me = state.staff.find(s => s.id === state.staffId);
  if (!me) { state.view = "manager"; return renderManager(); }
  const first = me.name.split(" ")[0];
  const mine = (state.slots || []).filter(s => s.staffId === me.id).sort((a, b) => a.date.localeCompare(b.date) || a.range.start - b.range.start);
  const draftTag = state.status === "draft" ? " · draft" : "";
  let out = `<div class="topbar"><div>
    <div class="wordmark">Hey ${esc(first)} 👋</div>
    <div class="subtitle">${esc(state.venue)}</div>
  </div></div>`;
  if (mine.length) {
    const n = mine[0];
    out += `<div class="nextcard">
      <div class="eyebrow">Next shift</div>
      <div class="day">${fmtDayLong(n.date)}</div>
      <div class="tabular">${roleName(n.roleId)} · ${fmtTime(n.range.start)}–${fmtTime(n.range.end)}${draftTag}</div>
    </div>`;
    if (mine.length > 1) {
      out += `<h2 style="font-size:16px;font-family:var(--font-display)">Coming up</h2><div class="upcoming">`;
      for (const s of mine.slice(1)) {
        out += `<div class="upcard"><div><div class="d">${fmtDayLong(s.date)}</div><div class="r">${roleName(s.roleId)}${draftTag}</div></div>
          <div class="t tabular">${fmtTime(s.range.start)}–${fmtTime(s.range.end)}</div></div>`;
      }
      out += `</div>`;
    }
  } else {
    out += `<div class="empty">No upcoming shifts yet — the next schedule hasn't been ${state.slots ? "assigned to you" : "generated"}.</div>`;
  }
  if (state.eightySix.length) {
    out += `<section class="board86" style="max-width:none">
      <h2>86 board</h2>
      <div class="desc">Out for service — don't sell these.</div>
      <div class="chips86">${state.eightySix.map(n => `<span class="chip86">86 ${esc(n)}</span>`).join("")}</div>
    </section>`;
  }
  out += renderChat(me.name);
  out += `<footer><a href="#" data-action="view-manager">← Manager view</a></footer>`;
  if (toastMsg) out += `<div class="toast">${esc(toastMsg)}</div>`;
  return out;
}

function bind() {
  app.querySelectorAll("[data-action]").forEach(el => {
    el.addEventListener("click", e => {
      const a = el.dataset.action;
      if ((a === "close-overlay" || a === "close-staff-modal") && e.target.closest(".modal")) return;
      e.preventDefault();
      if (a === "generate") doGenerate();
      else if (a === "publish") doPublish();
      else if (a === "print") window.print();
      else if (a === "pick") openPicker(el.dataset.slot);
      else if (a === "assign") doAssign(picker.slotId, el.dataset.staff || null);
      else if (a === "close-overlay") { picker = null; render(); }
      else if (a === "view-staff") { state.view = "staff"; state.staffId = el.dataset.staff; save(); render(); }
      else if (a === "view-manager") { state.view = "manager"; save(); render(); }
      else if (a === "setup") { state.view = "setup"; save(); render(); }
      else if (a === "dismiss-hint") { state.hintDismissed = true; save(); render(); }
      else if (a === "reset") resetDemo();
      else if (a === "add-staff") openStaffModal(null);
      else if (a === "edit-staff") openStaffModal(el.dataset.staff);
      else if (a === "remove-staff") removeStaff(el.dataset.staff);
      else if (a === "save-staff") saveStaffModal();
      else if (a === "close-staff-modal" || a === "close-staff-modal-btn") { staffModal = null; render(); }
      else if (a === "add-tmpl") addTemplateRow(Number(el.dataset.weekday));
      else if (a === "remove-tmpl") removeTemplateRow(Number(el.dataset.idx));
      else if (a === "add-86") add86();
      else if (a === "remove-86") remove86(Number(el.dataset.idx));
      else if (a === "send-chat") sendChat(el.dataset.from);
      else if (a === "add-role") addRole();
      else if (a === "remove-role") removeRole(el.dataset.role);
    });
  });
  const in86 = document.getElementById("i-86");
  if (in86) in86.addEventListener("keydown", e => { if (e.key === "Enter") add86(); });
  const inChat = document.getElementById("i-chat");
  if (inChat) inChat.addEventListener("keydown", e => {
    if (e.key === "Enter") sendChat(document.querySelector("[data-action='send-chat']").dataset.from);
  });
  app.querySelectorAll("[data-venue]").forEach(el => {
    el.addEventListener("change", () => {
      if (el.dataset.venue === "name") setVenue(el.value);
      else if (el.dataset.venue === "cadence") setCadence(Number(el.value));
    });
  });
  app.querySelectorAll("[data-role-rename]").forEach(el => {
    el.addEventListener("change", () => renameRole(el.dataset.roleRename, el.value));
  });
  app.querySelectorAll("[data-tmpl]").forEach(el => {
    el.addEventListener("change", () => {
      const idx = Number(el.dataset.tmpl), field = el.dataset.field;
      updateTemplateRow(idx, field, field === "roleId" ? el.value : Number(el.value));
    });
  });
  app.querySelectorAll("[data-rule]").forEach(el => {
    el.addEventListener("change", () => {
      const f = el.dataset.rule;
      if (f === "allowClopens" || f === "fairWeekends" || f === "preferLowerCost") updateRule(f, el.checked);
      else if (f === "budgetCents") updateRule(f, Math.max(0, Number(el.value)) * 100 || undefined);
      else updateRule(f, Math.max(0, Number(el.value)));
    });
  });
}
render();
</script>
