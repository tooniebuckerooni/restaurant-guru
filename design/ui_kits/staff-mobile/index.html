<!-- @dsCard group="Staff Mobile App" viewport="420x860" subtitle="My Shifts — light, glanceable, swap & time-off requests" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  html,body{margin:0;background:var(--neutral-100);}
  * { box-sizing:border-box; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/plain" id="app-source">
const { useState, useEffect, useRef } = React;

/* ---- Inlined copies of the design-system primitives (see /components) ---- */

function Icon({ name, size = 18, color = 'currentColor' }) {
  const ref = useRef(null);
  useEffect(() => {
    if (window.lucide && ref.current) {
      ref.current.innerHTML = '';
      const el = document.createElement('i');
      el.setAttribute('data-lucide', name);
      ref.current.appendChild(el);
      window.lucide.createIcons({ attrs: { width: size, height: size, 'stroke-width': 2, color }, root: ref.current });
    }
  }, [name, size, color]);
  return <span ref={ref} style={{ display:'inline-flex', width:size, height:size, color }} />;
}

function Button({ variant = 'primary', icon, children, onClick }) {
  const variants = {
    primary: { background:'var(--brand-primary)', color:'#fff', boxShadow:'var(--shadow-sm)' },
    secondary: { background:'var(--surface-card)', color:'var(--text-primary)', border:'1px solid var(--border-strong)' },
    ghost: { background:'transparent', color:'var(--text-primary)' },
  };
  return (
    <button onClick={onClick} style={{ display:'inline-flex', alignItems:'center', justifyContent:'center', gap:8, height:44, width:'100%', borderRadius:'var(--radius-md)', border:'1px solid transparent', fontFamily:'var(--font-body)', fontWeight:600, fontSize:14, cursor:'pointer', ...variants[variant] }}>
      {icon}{children}
    </button>
  );
}

function Badge({ kind = 'status', tone = 'draft', role, dot = true, children }) {
  const STATUS = { warning: { bg:'var(--warning-100)', fg:'var(--warning-700)', dot:'var(--warning-500)' } };
  let bg, fg, dotColor;
  if (kind === 'role') { bg = 'var(--role-bartender-tint)'; fg = 'var(--text-primary)'; dotColor = 'var(--role-bartender)'; }
  else { const t = STATUS[tone]; bg = t.bg; fg = t.fg; dotColor = t.dot; }
  return (
    <span style={{ display:'inline-flex', alignItems:'center', gap:6, padding:'3px 10px', borderRadius:999, background:bg, color:fg, fontFamily:'var(--font-body)', fontSize:12, fontWeight:600, whiteSpace:'nowrap' }}>
      {dot && <span style={{ width:6, height:6, borderRadius:'50%', background:dotColor }} />}
      {children}
    </span>
  );
}

function Modal({ title, children, onClose, footer }) {
  return (
    <div style={{ position:'absolute', inset:0, background:'var(--surface-overlay)', display:'flex', alignItems:'center', justifyContent:'center', fontFamily:'var(--font-body)', zIndex:10 }}>
      <div style={{ width:'88%', background:'var(--surface-card)', borderRadius:'var(--radius-xl)', boxShadow:'var(--shadow-lg)', display:'flex', flexDirection:'column', overflow:'hidden' }}>
        <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', padding:'16px 18px', borderBottom:'1px solid var(--border-default)' }}>
          <span style={{ fontFamily:'var(--font-display)', fontWeight:700, fontSize:17, color:'var(--text-primary)' }}>{title}</span>
          <button onClick={onClose} style={{ border:'none', background:'transparent', color:'var(--text-tertiary)', cursor:'pointer', display:'flex' }}><Icon name="x" size={18} /></button>
        </div>
        <div style={{ padding:18, color:'var(--text-primary)', fontSize:14, lineHeight:1.5 }}>{children}</div>
        {footer && <div style={{ display:'flex', flexDirection:'column', gap:8, padding:'14px 18px', borderTop:'1px solid var(--border-default)', background:'var(--surface-sunken)' }}>{footer}</div>}
      </div>
    </div>
  );
}

function Toast({ tone = 'success', message, onDismiss }) {
  const TONES = { success:{bg:'var(--success-500)',fg:'#fff'} };
  const t = TONES[tone] || TONES.success;
  return (
    <div style={{ display:'flex', alignItems:'center', gap:12, padding:'12px 16px', borderRadius:'var(--radius-md)', background:t.bg, color:t.fg, fontFamily:'var(--font-body)', fontSize:13.5, fontWeight:600, boxShadow:'var(--shadow-lg)' }}>
      <span style={{ flex:1 }}>{message}</span>
      {onDismiss && <button onClick={onDismiss} style={{ border:'none', background:'transparent', color:t.fg, opacity:0.75, cursor:'pointer', display:'flex' }}><Icon name="x" size={15} /></button>}
    </div>
  );
}

function ChatMsg({ initials, color, name, text, time }) {
  return (
    <div style={{ display:'flex', gap:10 }}>
      <div style={{ width:30, height:30, borderRadius:'50%', background:color, color:'#fff', display:'flex', alignItems:'center', justifyContent:'center', fontSize:11, fontWeight:700, flexShrink:0 }}>{initials}</div>
      <div style={{ display:'flex', flexDirection:'column', gap:3 }}>
        <div style={{ display:'flex', alignItems:'baseline', gap:6 }}>
          <span style={{ fontSize:12.5, fontWeight:700, color:'var(--text-primary)' }}>{name}</span>
          <span style={{ fontSize:10.5, color:'var(--text-tertiary)' }}>{time}</span>
        </div>
        <div style={{ background:'var(--surface-sunken)', borderRadius:14, borderTopLeftRadius:4, padding:'8px 12px', fontSize:13.5, color:'var(--text-primary)', lineHeight:1.4, maxWidth:236 }}>{text}</div>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------- */

const SHIFTS = [
  { day:'Today', time:'4:00 PM – 10:00 PM', status:'default', highlight:true },
  { day:'Friday', time:'5:00 PM – 11:00 PM', status:'default' },
  { day:'Saturday', time:'6:00 PM – 1:00 AM', status:'pending-swap' },
  { day:'Sunday', time:'11:00 AM – 4:00 PM', status:'default' },
];

function ShiftCard({ s, onSwap }) {
  const isPending = s.status === 'pending-swap';
  return (
    <div style={{ display:'flex', alignItems:'center', gap:12, background: s.highlight ? 'var(--brand-50)' : 'var(--surface-card)', border: s.highlight ? '1px solid var(--brand-200)' : '1px solid var(--border-default)', borderRadius:'var(--radius-lg)', padding:'14px 16px', boxShadow:'var(--shadow-sm)' }}>
      <div style={{ width:4, alignSelf:'stretch', borderRadius:4, background: isPending ? 'var(--warning-500)' : 'var(--role-bartender)' }} />
      <div style={{ flex:1, display:'flex', flexDirection:'column', gap:4 }}>
        <div style={{ display:'flex', alignItems:'center', gap:8 }}>
          <span style={{ fontSize:14, fontWeight:700, color:'var(--text-primary)' }}>{s.day}</span>
          {isPending && <Badge kind="status" tone="warning">Swap pending</Badge>}
        </div>
        <span style={{ fontSize:15, fontWeight:600, color:'var(--text-primary)', fontFeatureSettings:"'tnum' 1" }}>{s.time}</span>
        <Badge kind="role" dot={false}>Bartender · The Amber Room</Badge>
      </div>
      {!isPending && (
        <button onClick={onSwap} style={{ border:'1px solid var(--border-strong)', background:'var(--surface-card)', borderRadius:'var(--radius-md)', padding:'8px 10px', fontSize:12.5, fontWeight:700, color:'var(--text-primary)', cursor:'pointer', display:'flex', alignItems:'center', gap:5 }}><Icon name="repeat-2" size={14} />Swap</button>
      )}
    </div>
  );
}

function App() {
  const [modal, setModal] = useState(false);
  const [toast, setToast] = useState(null);

  return (
    <div style={{ position:'relative', width:390, minHeight:844, margin:'0 auto', background:'var(--surface-page)', fontFamily:'var(--font-body)', display:'flex', flexDirection:'column' }}>
      <div style={{ height:14 }} />
      <div style={{ display:'flex', justifyContent:'flex-end', padding:'0 20px' }}>
        <a href="../manager-schedule-grid/index.html" style={{ display:'flex', alignItems:'center', gap:6, fontSize:12, fontWeight:700, color:'var(--brand-700)', background:'var(--brand-primary-tint)', border:'1px solid var(--brand-200)', borderRadius:'var(--radius-md)', padding:'6px 10px', textDecoration:'none' }}>
          <Icon name="layout-dashboard" size={13} color="var(--brand-700)" /> Manager view
        </a>
      </div>
      <div style={{ padding:'8px 20px 14px' }}>
        <div style={{ fontSize:13, fontWeight:600, color:'var(--text-tertiary)' }}>Hey Ava 👋</div>
        <div style={{ fontFamily:'var(--font-display)', fontSize:28, fontWeight:800, color:'var(--text-primary)' }}>My shifts</div>
      </div>

      {/* 86 board — kitchen-critical stock status, always visible up top */}
      <div style={{ margin:'0 20px 14px', background:'var(--neutral-800)', borderRadius:'var(--radius-lg)', padding:'12px 16px', display:'flex', flexDirection:'column', gap:9, boxShadow:'var(--shadow-sm)' }}>
        <div style={{ display:'flex', alignItems:'center', gap:6 }}>
          <Icon name="circle-slash" size={13} color="var(--neutral-0)" />
          <span style={{ fontSize:11, fontWeight:800, letterSpacing:'0.07em', color:'var(--neutral-0)', textTransform:'uppercase' }}>86 board</span>
        </div>
        <div style={{ display:'flex', gap:8, flexWrap:'wrap' }}>
          <span style={{ display:'inline-flex', alignItems:'center', gap:6, padding:'5px 10px', borderRadius:999, background:'var(--error-100)', color:'var(--error-700)', fontSize:12.5, fontWeight:700 }}>
            <Icon name="ban" size={13} /> Onions — 86'd
          </span>
          <span style={{ display:'inline-flex', alignItems:'center', gap:6, padding:'5px 10px', borderRadius:999, background:'var(--warning-100)', color:'var(--warning-700)', fontSize:12.5, fontWeight:700 }}>
            <Icon name="printer" size={13} /> Thermal paper — Low
          </span>
        </div>
      </div>

      {/* Team chat — flagship visibility right up front */}
      <div style={{ margin:'0 20px 18px', background:'var(--surface-card)', border:'1px solid var(--border-default)', borderRadius:'var(--radius-lg)', boxShadow:'var(--shadow-sm)', overflow:'hidden' }}>
        <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', padding:'12px 16px', borderBottom:'1px solid var(--border-default)' }}>
          <div style={{ display:'flex', alignItems:'center', gap:7 }}>
            <Icon name="message-circle" size={16} color="var(--brand-600)" />
            <span style={{ fontSize:13.5, fontWeight:700, color:'var(--text-primary)' }}>Team chat</span>
            <span style={{ width:7, height:7, borderRadius:'50%', background:'var(--error-500)' }} />
          </div>
          <span style={{ fontSize:12, fontWeight:600, color:'var(--text-tertiary)' }}>The Amber Room</span>
        </div>
        <div style={{ padding:'14px 16px', display:'flex', flexDirection:'column', gap:12 }}>
          <ChatMsg initials="JF" color="var(--role-server)" name="Jules F." text="hey can anyone cover my Fri 5–11? something came up 🙏" time="2:14 PM" />
          <ChatMsg initials="SD" color="var(--role-barback)" name="Sam D." text="I got you, I'll take it" time="2:20 PM" />
          <div style={{ display:'flex', justifyContent:'center' }}>
            <span style={{ display:'inline-flex', alignItems:'center', gap:6, padding:'5px 12px', borderRadius:999, background:'var(--warning-100)', color:'var(--warning-700)', fontSize:11.5, fontWeight:700 }}>
              <Icon name="hourglass" size={12} /> Shift swap waiting for manager approval
            </span>
          </div>
        </div>
      </div>

      <div style={{ margin:'0 20px 18px', background:'var(--brand-500)', borderRadius:'var(--radius-xl)', padding:'18px 20px', color:'#fff', display:'flex', justifyContent:'space-between', alignItems:'center', boxShadow:'var(--shadow-md)' }}>
        <div>
          <div style={{ fontSize:12.5, fontWeight:600, opacity:0.85 }}>This week</div>
          <div style={{ fontFamily:'var(--font-display)', fontSize:26, fontWeight:800, fontFeatureSettings:"'tnum' 1" }}>22.5 hrs</div>
        </div>
        <div style={{ textAlign:'right' }}>
          <div style={{ fontSize:12.5, fontWeight:600, opacity:0.85 }}>Next shift</div>
          <div style={{ fontSize:15, fontWeight:700 }}>Today, 4 PM</div>
        </div>
      </div>

      <div style={{ padding:'0 20px', display:'flex', flexDirection:'column', gap:12, flex:1 }}>
        {SHIFTS.map((s, i) => <ShiftCard key={i} s={s} onSwap={() => setModal(true)} />)}

        <div style={{ display:'flex', alignItems:'center', gap:12, background:'var(--surface-card)', border:'1px solid var(--border-default)', borderRadius:'var(--radius-lg)', padding:'14px 16px', boxShadow:'var(--shadow-sm)' }}>
          <div style={{ width:36, height:36, borderRadius:'50%', background:'var(--brand-100)', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
            <Icon name="calendar-check" size={17} color="var(--brand-700)" />
          </div>
          <div style={{ flex:1, display:'flex', flexDirection:'column', gap:2 }}>
            <span style={{ fontSize:12.5, fontWeight:700, color:'var(--text-secondary)', textTransform:'uppercase', letterSpacing:'0.03em' }}>Standard availability</span>
            <span style={{ fontSize:14, fontWeight:600, color:'var(--text-primary)' }}>Wed–Sun, evenings</span>
          </div>
          <button style={{ border:'1px solid var(--border-strong)', background:'var(--surface-card)', borderRadius:'var(--radius-md)', padding:'7px 12px', fontSize:12.5, fontWeight:700, color:'var(--text-primary)', cursor:'pointer' }}>Edit</button>
        </div>
      </div>

      <div style={{ padding:'18px 20px', display:'flex', gap:10 }}>
        <div style={{ flex:1 }}><Button variant="secondary" icon={<Icon name="calendar-off" size={16} />}>Time off</Button></div>
        <div style={{ flex:1 }}><Button variant="primary" icon={<Icon name="repeat-2" size={16} color="#fff" />} onClick={() => setToast('Swap request sent to Maya R.')}>Swap a shift</Button></div>
      </div>

      <div style={{ display:'flex', justifyContent:'space-around', padding:'12px 0 22px', borderTop:'1px solid var(--border-default)', background:'var(--surface-card)' }}>
        <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:4 }}>
          <Icon name="calendar-days" size={22} color="var(--brand-600)" />
          <span style={{ fontSize:11, fontWeight:700, color:'var(--brand-600)' }}>Shifts</span>
        </div>
        <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:4, position:'relative' }}>
          <Icon name="message-circle" size={22} color="var(--neutral-400)" />
          <span style={{ position:'absolute', top:-2, right:6, width:7, height:7, borderRadius:'50%', background:'var(--error-500)', border:'2px solid var(--surface-card)' }} />
          <span style={{ fontSize:11, fontWeight:600, color:'var(--text-tertiary)' }}>Chat</span>
        </div>
        <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:4 }}>
          <Icon name="inbox" size={22} color="var(--neutral-400)" />
          <span style={{ fontSize:11, fontWeight:600, color:'var(--text-tertiary)' }}>Requests</span>
        </div>
        <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:4 }}>
          <Icon name="user-round" size={22} color="var(--neutral-400)" />
          <span style={{ fontSize:11, fontWeight:600, color:'var(--text-tertiary)' }}>Profile</span>
        </div>
      </div>

      {modal && (
        <Modal title="Swap Sat 11 shift" onClose={() => setModal(false)}
          footer={<>
            <Button variant="primary" onClick={() => { setModal(false); setToast('Swap request sent'); }}>Send request</Button>
            <Button variant="ghost" onClick={() => setModal(false)}>Cancel</Button>
          </>}>
          Ask a teammate to cover your 6:00 PM – 1:00 AM shift. They'll get a notification to accept.
        </Modal>
      )}

      {toast && (
        <div style={{ position:'absolute', top:16, left:20, right:20, zIndex:20 }}>
          <Toast tone="success" message={toast} onDismiss={() => setToast(null)} />
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script>
  var __src = document.getElementById('app-source').textContent;
  var __out = Babel.transform(__src, { presets: [['react', { runtime: 'classic' }]] }).code;
  (0, eval)(__out);
</script>
</body>
</html>
