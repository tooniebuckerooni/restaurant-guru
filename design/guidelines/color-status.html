<!-- @dsCard group="Colors" viewport="700x170" subtitle="Published, warning, conflict, draft — badges & tints" name="Status" -->
<link rel="stylesheet" href="../styles.css">
<div style="font-family:var(--font-body); padding:16px; background:var(--surface-page); display:flex; gap:20px;">
  <div style="display:flex;flex-direction:column;gap:8px;align-items:flex-start">
    <span style="display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:var(--radius-full);background:var(--success-100);color:var(--success-700);font-size:12px;font-weight:600"><span style="width:6px;height:6px;border-radius:50%;background:var(--success-500)"></span>Published</span>
    <div style="width:150px;height:34px;border-radius:8px;background:var(--success-100);border-left:3px solid var(--success-500)"></div>
    <span style="font-size:11px;color:var(--text-tertiary)">success-500 / -100 / -700</span>
  </div>
  <div style="display:flex;flex-direction:column;gap:8px;align-items:flex-start">
    <span style="display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:var(--radius-full);background:var(--warning-100);color:var(--warning-700);font-size:12px;font-weight:600"><span style="width:6px;height:6px;border-radius:50%;background:var(--warning-500)"></span>Near overtime</span>
    <div style="width:150px;height:34px;border-radius:8px;background:var(--warning-100);border-left:3px solid var(--warning-500)"></div>
    <span style="font-size:11px;color:var(--text-tertiary)">warning-500 / -100 / -700</span>
  </div>
  <div style="display:flex;flex-direction:column;gap:8px;align-items:flex-start">
    <span style="display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:var(--radius-full);background:var(--error-100);color:var(--error-700);font-size:12px;font-weight:600"><span style="width:6px;height:6px;border-radius:50%;background:var(--error-500)"></span>Double-booked</span>
    <div style="width:150px;height:34px;border-radius:8px;background:var(--error-100);border-left:3px solid var(--error-500)"></div>
    <span style="font-size:11px;color:var(--text-tertiary)">error-500 / -100 / -700</span>
  </div>
  <div style="display:flex;flex-direction:column;gap:8px;align-items:flex-start">
    <span style="display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:var(--radius-full);background:var(--draft-100);color:var(--draft-700);font-size:12px;font-weight:600"><span style="width:6px;height:6px;border-radius:50%;background:var(--draft-500)"></span>Draft</span>
    <div style="width:150px;height:34px;border-radius:8px;background:var(--draft-100);border-left:3px solid var(--draft-500)"></div>
    <span style="font-size:11px;color:var(--text-tertiary)">draft = neutral-500/100/700</span>
  </div>
</div>
