<!-- @dsCard group="Spacing" viewport="700x180" subtitle="Corner radii + warm elevation shadows" name="Radii & Elevation" -->
<link rel="stylesheet" href="../styles.css">
<div style="font-family:var(--font-body); padding:20px; background:var(--surface-page); display:flex; gap:16px; align-items:center;">
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:64px;height:64px;background:var(--surface-card);border-radius:var(--radius-sm);box-shadow:var(--shadow-sm)"></div><span style="font-size:11px;color:var(--text-tertiary)">sm 6px</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:64px;height:64px;background:var(--surface-card);border-radius:var(--radius-md);box-shadow:var(--shadow-md)"></div><span style="font-size:11px;color:var(--text-tertiary)">md 10px</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:64px;height:64px;background:var(--surface-card);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg)"></div><span style="font-size:11px;color:var(--text-tertiary)">lg 14px</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:64px;height:64px;background:var(--surface-card);border-radius:var(--radius-xl);box-shadow:var(--shadow-lg)"></div><span style="font-size:11px;color:var(--text-tertiary)">xl 20px</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:64px;height:64px;background:var(--brand-500);border-radius:var(--radius-full)"></div><span style="font-size:11px;color:var(--text-tertiary)">full / pill</span></div>
</div>
