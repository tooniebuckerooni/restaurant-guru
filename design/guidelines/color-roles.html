<!-- @dsCard group="Colors" viewport="700x220" subtitle="8 roles, distinguishable side-by-side, clear of status hues" name="Role Colors" -->
<link rel="stylesheet" href="../styles.css">
<div style="font-family:var(--font-body); padding:16px; background:var(--surface-page); display:grid; grid-template-columns:repeat(4,1fr); gap:10px;">
  <div style="display:flex;align-items:center;gap:8px;background:var(--role-bartender-tint);border-left:4px solid var(--role-bartender);border-radius:8px;padding:8px 10px"><span style="font-size:12px;font-weight:600;color:var(--text-primary)">Bartender</span></div>
  <div style="display:flex;align-items:center;gap:8px;background:var(--role-server-tint);border-left:4px solid var(--role-server);border-radius:8px;padding:8px 10px"><span style="font-size:12px;font-weight:600;color:var(--text-primary)">Server</span></div>
  <div style="display:flex;align-items:center;gap:8px;background:var(--role-kitchen-tint);border-left:4px solid var(--role-kitchen);border-radius:8px;padding:8px 10px"><span style="font-size:12px;font-weight:600;color:var(--text-primary)">Kitchen</span></div>
  <div style="display:flex;align-items:center;gap:8px;background:var(--role-host-tint);border-left:4px solid var(--role-host);border-radius:8px;padding:8px 10px"><span style="font-size:12px;font-weight:600;color:var(--text-primary)">Host</span></div>
  <div style="display:flex;align-items:center;gap:8px;background:var(--role-barback-tint);border-left:4px solid var(--role-barback);border-radius:8px;padding:8px 10px"><span style="font-size:12px;font-weight:600;color:var(--text-primary)">Barback</span></div>
  <div style="display:flex;align-items:center;gap:8px;background:var(--role-manager-tint);border-left:4px solid var(--role-manager);border-radius:8px;padding:8px 10px"><span style="font-size:12px;font-weight:600;color:var(--text-primary)">Manager</span></div>
  <div style="display:flex;align-items:center;gap:8px;background:var(--role-driver-tint);border-left:4px solid var(--role-driver);border-radius:8px;padding:8px 10px"><span style="font-size:12px;font-weight:600;color:var(--text-primary)">Driver</span></div>
  <div style="display:flex;align-items:center;gap:8px;background:var(--role-cleaner-tint);border-left:4px solid var(--role-cleaner);border-radius:8px;padding:8px 10px"><span style="font-size:12px;font-weight:600;color:var(--text-primary)">Cleaner</span></div>
</div>
