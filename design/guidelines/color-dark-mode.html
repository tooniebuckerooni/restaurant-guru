<!-- @dsCard group="Colors" viewport="700x260" subtitle="Same tokens, data-theme=&quot;dark&quot; scope — bar managers close at 2am" name="Dark Mode" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex; gap:0;">
  <div style="flex:1; padding:16px; background:var(--surface-page); font-family:var(--font-body); display:flex; flex-direction:column; gap:10px;">
    <span style="font-size:11px;font-weight:700;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.04em">Light</span>
    <div style="background:var(--surface-card);border:1px solid var(--border-default);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px">
      <span style="font-size:13px;font-weight:700;color:var(--text-primary)">Maya R. · Bartender</span>
      <span style="font-size:12px;color:var(--text-secondary)">5:00 PM – 11:00 PM</span>
      <span style="display:inline-flex;width:fit-content;padding:2px 8px;border-radius:999px;background:var(--success-100);color:var(--success-700);font-size:11px;font-weight:700">Published</span>
    </div>
  </div>
  <div data-theme="dark" style="flex:1; padding:16px; background:var(--surface-page); font-family:var(--font-body); display:flex; flex-direction:column; gap:10px;">
    <span style="font-size:11px;font-weight:700;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.04em">Dark</span>
    <div style="background:var(--surface-card);border:1px solid var(--border-default);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px">
      <span style="font-size:13px;font-weight:700;color:var(--text-primary)">Maya R. · Bartender</span>
      <span style="font-size:12px;color:var(--text-secondary)">5:00 PM – 11:00 PM</span>
      <span style="display:inline-flex;width:fit-content;padding:2px 8px;border-radius:999px;background:var(--success-100);color:var(--success-700);font-size:11px;font-weight:700">Published</span>
    </div>
  </div>
</div>
